# =========================================================
# ARANDU + YOLO CLASIFICACIÓN (Backbone SSL ConvNeXt V2 Tiny)
# =========================================================
# Este modelo usa el encoder SSL y termina directamente en un 
# cabezal de clasificación. No genera bounding boxes.

nc: 3  # dataset de prueba: healthy, mosaic, frog_eye

backbone:
  # AranduYOLOClsWrapper devuelve solo el último feature map (P5), 
  # que tiene el contexto global de la hoja (1024 canales).
  - [-1, 1, AranduYOLOClsWrapper, []]

head:
  # AranduClassify aplica Global Average Pooling (GAP) y una capa lineal
  # interceptando el tamaño de los canales correctamente (1024).
  - [-1, 1, AranduClassify, [nc]]
