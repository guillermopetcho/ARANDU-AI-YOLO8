# =========================================================
# ARANDU + YOLO (Backbone SSL MoCo ResNet50 con Adaptador Espacial)
# =========================================================

# Parámetros
# ⚠️  AJUSTAR nc según el dataset:
#     nc: 1  → detección binaria (sano vs. enfermo)
#     nc: N  → N clases de enfermedades específicas
nc: 1  # número de clases (ajustar antes de entrenar)

# =========================================================
# BACKBONE (Interfaz Óptima)
# =========================================================
# AranduBackbone ahora devuelve 3 escalas [P3, P4, P5]
# *YA ADAPTADAS* en distribución y canales a lo que espera YOLO.

backbone:
  # Layer 0: AranduBackbone devuelve una lista [P3, P4, P5].
  # Ultralytics interpreta la lista como 3 salidas indexadas en 1, 2 y 3.
  # El neck referencia estas salidas directamente por índice absoluto.
  - [-1, 1, AranduYOLOWrapper, []]   

# =========================================================
# NECK & HEAD (Estilo PAN-FPN)
# =========================================================
# A partir de aquí, el Neck recibe las activaciones con la localidad
# y varianza correctas, eliminando la asimetría de entrenamiento.

neck:
  - [3, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[4, 2], 1, Concat, [1]]
  - [5, 3, C2f, [512]]
  
  - [6, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[7, 1], 1, Concat, [1]]
  - [8, 3, C2f, [256]]  # P3 final
  
  - [9, 1, Conv, [256, 3, 2]]
  - [[10, 6], 1, Concat, [1]]
  - [11, 3, C2f, [512]] # P4 final
  
  - [12, 1, Conv, [512, 3, 2]]
  - [[13, 3], 1, Concat, [1]]
  - [14, 3, C2f, [1024]] # P5 final

head:
  - [[9, 12, 15], 1, Detect, [nc]]
