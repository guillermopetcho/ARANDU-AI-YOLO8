# =========================================================
# ARANDU + YOLO SEGMENTATION (Backbone SSL ConvNeXt V2 Tiny)
# =========================================================
#
# ⚠️  AJUSTAR nc AL NÚMERO REAL DE CLASES DEL DATASET ANTES DE ENTRENAR.
nc: 5  # Dataset soja: 5 clases de enfermedades

# =========================================================
# BACKBONE
# =========================================================
# AranduYOLOWrapper = AranduBackbone (ConvNeXt V2 Tiny).
# Genera [P2, P3, P4, P5] y las capas Index extraen cada escala:
#   0: AranduYOLOWrapper → tuple [P2, P3, P4, P5]
#   1: Index 0 → P2: [128ch, H/4,  W/4]   (micro-lesiones)
#   2: Index 1 → P3: [256ch, H/8,  W/8]   (lesiones pequeñas)
#   3: Index 2 → P4: [512ch, H/16, W/16]  (lesiones medias)
#   4: Index 3 → P5: [1024ch, H/32, W/32] (contexto semántico global)

backbone:
  - [-1, 1, AranduYOLOWrapper, []]
  - [0, 1, Index, [128, 0]]
  - [0, 1, Index, [256, 1]]
  - [0, 1, Index, [512, 2]]
  - [0, 1, Index, [1024, 3]]

# =========================================================
# HEAD (FPN + PAN Neck + Segment Head — 4 escalas P2 a P5)
# =========================================================
head:
  # --- FPN Top-Down ---
  - [4, 1, nn.Upsample, [None, 2, "nearest"]]    # 5:  Upsample P5
  - [[5, 3], 1, Concat, [1]]                      # 6:  Concat(UP_P5, P4)
  - [6, 3, C2f, [512]]                            # 7:  P4_fpn

  - [7, 1, nn.Upsample, [None, 2, "nearest"]]    # 8:  Upsample P4_fpn
  - [[8, 2], 1, Concat, [1]]                      # 9:  Concat(UP_P4, P3)
  - [9, 3, C2f, [256]]                            # 10: P3_fpn

  - [10, 1, nn.Upsample, [None, 2, "nearest"]]   # 11: Upsample P3_fpn
  - [[11, 1], 1, Concat, [1]]                     # 12: Concat(UP_P3, P2)
  - [12, 3, C2f, [128]]                           # 13: P2_final (micro-lesiones)

  # --- PAN Bottom-Up ---
  - [13, 1, Conv, [128, 3, 2]]                   # 14: Downsample P2_final
  - [[14, 10], 1, Concat, [1]]                    # 15: Concat(↓P2, P3_fpn)
  - [15, 3, C2f, [256]]                           # 16: P3_final (small)

  - [16, 1, Conv, [256, 3, 2]]                   # 17: Downsample P3_final
  - [[17, 7], 1, Concat, [1]]                     # 18: Concat(↓P3, P4_fpn)
  - [18, 3, C2f, [512]]                           # 19: P4_final (medium)

  - [19, 1, Conv, [512, 3, 2]]                   # 20: Downsample P4_final
  - [[20, 4], 1, Concat, [1]]                     # 21: Concat(↓P4, P5)
  - [21, 3, C2f, [1024]]                          # 22: P5_final (large)

  # --- Segment Head ---
  - [[13, 16, 19, 22], 1, Segment, [nc, 32, 256]] # 23: Segment Head
