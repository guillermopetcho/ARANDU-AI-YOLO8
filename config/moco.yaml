training:
  exploitation_mode: False
  seed: 42
  # === FASE 1: Entrenamiento desde cero a 384px ===
  epochs: 20
  warmup_epochs: 2   # Fase 1 desde cero: necesita más warmup que un refinamiento
  final_lr_ratio: 0.1  # Bajar bastante el LR al final para cristalizar bien
  batch_size: 16   # 384px: cabe bien en T4 con AMP
  grad_accum_steps: 8   # EffBatch = 16 × 8 × 2 GPUs = 256
  num_workers: 4
  lr_base: 0.00002  # 2e-5: muy conservador, refinamiento fino
  weight_decay: 0.05
  grad_clip: 0.3    # Más restrictivo: no queremos perturbaciones grandes
  use_amp: True
  save_every: 1     # Guardar cada epoch: la ventana de mejora es estrecha
  early_stopping_patience: 7
  curriculum_epoch: 0  # Todos los crops activos
  freeze_stages: 0  # FASE 1: NO congelar nada, entrenar desde cero
  use_compile: false

moco:
  dim: 512
  queue: 32768         # Cola doblada para 2xT4: mejora manifold y uniformidad
  momentum_start: 0.996
  momentum_end: 0.999
  temp_start: 0.12     # Empezamos con la temperatura final de Fase 1
  temp_end: 0.10       # Baja levemente: espacio latente ya maduro
  temp_warmup_steps: 50
  predictor_hidden_dim: 1024
  # Fase 1: Resolución 384px
  global_crop_size: 384   
  # Crops locales proporcionales a la resolución global
  num_local_crops: 4
  local_crop_scale_min: 0.10
  local_crop_scale_max: 0.35
  local_crop_size: 96        
  local_loss_weight: 0.20

  # === AUGMENTATION (domain-specific para patología foliar de soja) ===
  # Todos los valores son leídos por MoCoDataset y pasados a get_global/local_transforms().
  augmentation:
    # --- Color ---
    # hue: rotación de matiz. CRÍTICO mantener bajo.
    #   mosaic           → moteado verde/amarillo  (color clave)
    #   potassium_deficiency → amarillamiento marginal (color clave)
    #   frog_eye         → manchas marrón con halo pálido (color clave)
    # hue=0.02 ≈ ±7° en el círculo cromático: invisible al ojo, inocuo para el encoder.
    hue: 0.02

    # grayscale_p: probabilidad de convertir a escala de grises.
    # Las 5 clases tienen señal diagnóstica en color → p muy baja.
    grayscale_p: 0.05

    # --- Blur (vistas globales 384px) ---
    # Simula variación de distancia cámara-hoja y desfoque óptico.
    # kernel fijo en 11 (≈384/35). p reducida vs. MoCo original (0.5→0.4).
    global_blur_p: 0.40

    # --- Rotación (vistas globales) ---
    # Hojas y texturas son isótropas: no existe orientación canónica.
    # ±15° es suficiente sin perder contexto morfológico.
    global_rotation_p: 0.30

    # --- Blur (vistas locales 96px) ---
    # kernel dinámico (≈ size/13 | 1, mínimo 3).
    # p reducida: los crops locales muestran micro-lesiones → no blur agresivo.
    local_blur_p: 0.30

paths:
  # === FASE 1: Entrenamiento desde cero ===
  dataset_root: "/kaggle/input/datasets/joaquinignaciopetcho/textura-base-correcta/train"
  eval_train_root: "/kaggle/input/datasets/joaquinignaciopetcho/textura-base-correcta/train"
  eval_val_root: "/kaggle/input/datasets/joaquinignaciopetcho/textura-base-correcta/val"
  data_yaml: ""
  # === Checkpoints: Nombres nuevos para evitar choques con archivos viejos ===
  resume_checkpoint: ""  
  checkpoint_path: "/kaggle/working/moco_fase1_checkpoint.pth"
  best_checkpoint_path: "/kaggle/working/moco_fase1_best.pth"
  encoder_export_path: "/kaggle/working/moco_encoder_fase1_ready.pth"
  metrics_path: "/kaggle/working/ssl_fase1_metrics.json"
  index_cache_path: "/kaggle/working/train_fase1_index.npy"

eval:
  subset_size: 1000
  knn_k: 20
  # L5 FIX: linear_probe_epochs no estaba definido en el config, forzando siempre
  # el fallback hardcodeado de 25 en evaluation/linear_probe.py.
  # Ahora es configurable sin tocar el código fuente.
  linear_probe_epochs: 25
  linear_probe_batch_size: 32  # Reducido de 256 a 32 para evitar OOM

wandb:
  enabled: true
  project: "MoCo-ENCODER"

controller:
  Kp_tau: 0.01          # Ganancia reducida: ajustes más conservadores de tau
  Ki_tau_ratio: 50.0
  Kp_alpha: 0.002       # Freno de momentum más suave
  Kp_lr: 0.3
  lr_recovery_rate: 1.01
  crisis_threshold: 2
  deadband_u: 0.15      # Zona muerta más amplia: ignorar pequeñas fluctuaciones
  deadband_d: 0.15
  deadband_r: 0.08
  tau_max: 0.15         # CLAVE: el AAC NO puede subir tau por encima de 0.15
  momentum_max: 0.9995  # CLAVE: el key encoder no puede volverse inmóvil (era 0.99999)