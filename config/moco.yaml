training:
  exploitation_mode: False  # Reactivar AAC para que controle con los nuevos límites
  seed: 42
  epochs: 5   # Mini-fase quirúrgica: 3-5 epochs máximo desde epoch 9-11
  warmup_epochs: 0   # Sin warmup en mini-fase
  final_lr_ratio: 0.1
  batch_size: 32
  grad_accum_steps: 4
  num_workers: 8
  lr_base: 0.002  # LR muy conservador para la mini-fase de estabilización
  weight_decay: 0.0001
  use_amp: True
  save_every: 1   # Guardar cada epoch en mini-fase para no perder el mejor
  early_stopping_patience: 3  # Parar rápido si no mejora
  # B-COMPILE FIX: desactivado por defecto para el smoke test.
  # Activar SOLO en el segundo run, después de validar estabilidad.
  use_compile: false

moco:
  dim: 512
  queue: 16384         # Cola recomendada para estabilidad de representación global
  momentum_base: 0.999
  temp_start: 0.12     # τ inicial conservador, dentro del rango [0.10, 0.15]
  temp_end: 0.10       # τ mínimo: preservar estructura local
  temp_warmup_steps: 100
  # MoCo v3: Predictor MLP (cabeza de predicción para queries solamente)
  predictor_hidden_dim: 1024  # 512→1024→512 (diseño original). 4096 cuadriplicaba VRAM innecesariamente.
  # Multi-Crop DINO-style: Vistas locales adicionales de alta granularidad
  # NOTA: Los siguientes parámetros son INFORMATIVOS (documentación de la arquitectura).
  # La implementación actual los hardcodea en models/moco.py::get_local_transforms().
  # Se mantienen aquí para referencia y futura refactorización a config-driven.
  num_local_crops: 4          # 4×96px + 2×64px (hardcodeado)
  local_crop_scale_min: 0.02  # escala mínima 64px (hardcodeado)
  local_crop_scale_max: 0.25  # escala máxima 96px (hardcodeado)
  local_crop_size: 96         # tamaño vista local mayor (hardcodeado)
  local_loss_weight: 0.25     # Reducido de 0.5: menos dominancia local, más estructura global

paths:
  dataset_root: "/kaggle/input/texturas-bases/TEXTURAS_BASES"
  eval_train_root: "/kaggle/input/texturas-bases/TEXTURAS_BASES/train"
  eval_val_root: "/kaggle/input/texturas-bases/TEXTURAS_BASES/val"
  # Al dejar data_yaml vacío, el cargador usará automáticamente los nombres 
  # de las carpetas (Frog_Leaf_Eye, bacterial_blight, etc.) como etiquetas.
  data_yaml: ""
  checkpoint_path: "/kaggle/working/moco_checkpoint.pth"
  best_checkpoint_path: "/kaggle/working/moco_best_checkpoint.pth"
  encoder_export_path: "/kaggle/working/moco_encoder_ready.pth"
  metrics_path: "/kaggle/working/ssl_metrics.json"
  index_cache_path: "/kaggle/working/train_index.npy"

eval:
  subset_size: 1000
  knn_k: 20
  # L5 FIX: linear_probe_epochs no estaba definido en el config, forzando siempre
  # el fallback hardcodeado de 25 en evaluation/linear_probe.py.
  # Ahora es configurable sin tocar el código fuente.
  linear_probe_epochs: 25
  linear_probe_batch_size: 256  # Tamaño de batch para la sonda lineal post-SSL

wandb:
  enabled: true
  project: "MoCo-ENCODER"

controller:
  Kp_tau: 0.01          # Ganancia reducida: ajustes más conservadores de tau
  Ki_tau_ratio: 50.0
  Kp_alpha: 0.002       # Freno de momentum más suave
  Kp_lr: 0.3
  lr_recovery_rate: 1.01
  crisis_threshold: 2
  deadband_u: 0.15      # Zona muerta más amplia: ignorar pequeñas fluctuaciones
  deadband_d: 0.15
  deadband_r: 0.08
  tau_max: 0.15         # CLAVE: el AAC NO puede subir tau por encima de 0.15
  momentum_max: 0.9995  # CLAVE: el key encoder no puede volverse inmóvil (era 0.99999)